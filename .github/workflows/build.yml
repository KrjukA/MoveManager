# Собирает «KRJUK Move Manager» для Windows и Mac. Запуск: тег v* (например v1.0) или вручную (Actions → Build apps → Run workflow).
name: Build apps
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Tests
        env: {PYTHONHASHSEED: "0"}
        run: python -m unittest discover -s tests

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows}
          - {os: macos-15, name: mac-apple-silicon}
          - {os: macos-15-intel, name: mac-intel}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install pyinstaller requests pillow
      - name: Archive name with version
        shell: bash
        run: |
          VER=$(python -c "import re; print(re.search(r'^VERSION = \"([^\"]+)\"', open('app.py', encoding='utf-8').read(), re.M).group(1))")
          echo "ZIP=KRJUK-Move-Manager-${VER}-${{ matrix.name }}.zip" >> "$GITHUB_ENV"
      - name: Build
        run: pyinstaller --noconfirm MoveManager.spec

      - name: Smoke test (Mac)
        if: runner.os == 'macOS'
        env: {MOVE_MANAGER_NO_WINDOW: "1", MOVE_MANAGER_NO_BROWSER: "1", MOVE_MANAGER_PORT: "8791"}
        run: |
          "dist/KRJUK Move Manager.app/Contents/MacOS/KRJUK Move Manager" & PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8791/ | grep -qi "move manager" && OK=1 && break; sleep 1; done
          # рисунки генератора (patterns/) попали внутрь: встроенные жанры отдаются
          curl -sf http://127.0.0.1:8791/api/drumgen/patterns | grep -q '"pocket:0"' && PAT=1
          kill $PID || true
          test "$OK" = 1
          test "$PAT" = 1
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env: {MOVE_MANAGER_NO_WINDOW: "1", MOVE_MANAGER_NO_BROWSER: "1", MOVE_MANAGER_PORT: "8791"}
        run: |
          $p = Start-Process -FilePath "dist\KRJUK Move Manager.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8791/).Content -match "move manager") { $ok = $true; break } } catch {} ; Start-Sleep 1 }
          $pat = $false
          if ($ok) { try { $pat = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8791/api/drumgen/patterns).Content -match '"pocket:0"' } catch {} }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "the app did not answer" }
          if (-not $pat) { throw "drum patterns are missing from the build" }

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/KRJUK Move Manager.app" "$ZIP"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\KRJUK Move Manager.exe" -DestinationPath "$env:ZIP"

      - uses: actions/upload-artifact@v6
        with:
          name: KRJUK-Move-Manager-${{ matrix.name }}
          path: ${{ env.ZIP }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ZIP }}
