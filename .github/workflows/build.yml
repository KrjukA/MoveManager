# Собирает «Move Manager» для Windows и Mac. Запуск: тег v* (например v1.0) или вручную (Actions → Build apps → Run workflow).
name: Build apps
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Tests
        env: {PYTHONHASHSEED: "0"}
        run: python -m unittest discover -s tests

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows}
          - {os: macos-15, name: mac-apple-silicon}
          - {os: macos-15-intel, name: mac-intel}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyinstaller requests
      - name: Build
        run: pyinstaller --noconfirm MoveManager.spec

      - name: Smoke test (Mac)
        if: runner.os == 'macOS'
        env: {MOVE_MANAGER_NO_WINDOW: "1", MOVE_MANAGER_NO_BROWSER: "1", MOVE_MANAGER_PORT: "8791"}
        run: |
          "dist/Move Manager.app/Contents/MacOS/Move Manager" & PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8791/ | grep -qi "move manager" && OK=1 && break; sleep 1; done
          kill $PID || true
          test "$OK" = 1
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env: {MOVE_MANAGER_NO_WINDOW: "1", MOVE_MANAGER_NO_BROWSER: "1", MOVE_MANAGER_PORT: "8791"}
        run: |
          $p = Start-Process -FilePath "dist\Move Manager.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8791/).Content -match "move manager") { $ok = $true; break } } catch {} ; Start-Sleep 1 }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "the app did not answer" }

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Move Manager.app" "Move-Manager-${{ matrix.name }}.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\Move Manager.exe" -DestinationPath "Move-Manager-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Move-Manager-${{ matrix.name }}
          path: Move-Manager-${{ matrix.name }}.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Move-Manager-${{ matrix.name }}.zip
